<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Saver</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow-lg p-4 w-100 m-1">
      <div
        class="d-flex justify-content-between align-items-start align-items-end"
      >
        <div>
          <h2 class="h5 mb-3">URL Saver</h2>
        </div>
        <div>
          <button class="btn btn-primary flex-fill" id="saveButton">
            <fi class="fa fa-save"></fi> Save
          </button>
        </div>
      </div>
      <!-- Input Fields -->
      <input class="form-control mb-2" placeholder="Site Name" id="siteName" />
      <input
        class="form-control mb-2"
        placeholder="URL"
        id="siteUrl"
        readonly
      />

      <!-- Folder Selection -->
      <div class="d-flex gap-1 mb-2">
        <div>
          <select class="form-select" id="folderSelect">
            <option>Default</option>
          </select>
        </div>
        <div>
          <input
            class="form-control"
            placeholder="New Category"
            id="newFolderInput"
          />
        </div>
        <div>
          <button id="addFolderButton" class="btn btn-success">+</button>
        </div>
      </div>
      <div id="message" class="hidden"></div>
      <!-- Buttons -->
      <div class="d-flex mb-3 gap-1">
        <div>
          <select name="select" id="select" class="form-select">
            <option value="all">Categories</option>
          </select>
        </div>
        <div class="p-0 m-0">
          <button class="btn btn-primary flex-fill" id="editFolderButton">
            <fi class="fa fa-edit"></fi>category
          </button>
        </div>
        <div>
          <button class="btn btn-danger flex-fill" id="deleteFolderButton">
            <fi class="fa fa-trash"></fi>cate..
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-container">
        <input type="text" placeholder="Search sites..." id="searchInput" />
        <!-- <i class="fa fa-search search-icon"></i> -->
      </div>

      <!-- Site List -->
      <div class="list-group overflow-auto">
        <ol
          id="sitesList"
          class="list-group list-group-flush overflow-auto"
        ></ol>
      </div>
    </div>

    <script src="./popup.js"></script>
  </body>
</html>
