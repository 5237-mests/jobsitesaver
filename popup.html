<!DOCTYPE html>
<html>
  <head>
    <title>Job Site Saver</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="">
    <h1>Job Site Saver</h1>
    <input type="text" id="siteName" placeholder="Site Title" />
    <input type="text" id="siteUrl" placeholder="Site URL" readonly />
    <select id="folderSelect">
      <option value="default">Default</option>
    </select>
    <input type="text" id="newFolderInput" placeholder="New Folder Name" />
    <div class="d-flex">
      <button id="addFolderButton" class="btn btn-secondary">Add Folder</button>

      <button id="saveButton" class="btn btn-primary">Save Site</button>
    </div>
    <div class="my-1 d-flex">
      <select name="select" id="select" class="">
        <option value="all">All Folders</option>
      </select>
      <button id="editFolderButton" class="btn">Edit Folder</button>
      <button id="deleteFolderButton" class="btn">Delete Folder</button>
    </div>
    <ul id="sitesList"></ul>
    <script src="popup.js"></script>
  </body>
</html>
